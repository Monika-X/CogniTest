<!DOCTYPE html>

<body style="display:flex;flex-direction:column;min-height:100vh">

  <div style="position:absolute;width:500px;height:500px;background:var(--color-indigo);border-radius:50%;filter:blur(120px);opacity:0.06;top:-100px;left:-100px;pointer-events:none" aria-hidden="true"></div>

  <div style="text-align:center;max-width:600px;position:relative;z-index:1">
    <!-- Animated 404 Number -->
    <div style="font-family:var(--font-heading);font-size:clamp(6rem,20vw,12rem);font-weight:900;line-height:1;background:var(--gradient-primary);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 3s ease-in-out infinite;margin-bottom:var(--space-4)" aria-hidden="true">404</div>

    <h1 style="font-family:var(--font-heading);font-size:var(--text-3xl);font-weight:800;margin-bottom:var(--space-4)">Oops! This Page is Missing</h1>

    <div style="display:flex;gap:var(--space-4);justify-content:center;flex-wrap:wrap;margin-bottom:var(--space-10)">
      <a href="../index.html" class="btn btn-primary btn-lg"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Go Home</a>

    </div>

    <!-- Quick Links -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)">
      <a href="courses.html" style="text-decoration:none">
        <div class="card" style="text-align:center;padding:var(--space-5);transition:all var(--transition-base)">
          <div style="height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-2);color:var(--color-indigo-light)" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
          <div style="font-family:var(--font-heading);font-weight:700;font-size:var(--text-sm)">Courses</div>
        </div>
      </a>
      <a href="faculty.html" style="text-decoration:none">
        <div class="card" style="text-align:center;padding:var(--space-5)">
          <div style="height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-2);color:var(--color-cyan)" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>

      <a href="blog.html" style="text-decoration:none">

        </div>
